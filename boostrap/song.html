<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>ORAK MUSIC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI;
        }

        body {
            background:
                linear-gradient(135deg,
                    #080810,
                    #15152b,
                    #05050a);

            color: white;
            overflow-x: hidden;
        }

        /* NAVBAR */

        nav {

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 25px 8%;

            backdrop-filter: blur(20px);

            position: fixed;

            width: 100%;
            z-index: 1000;
        }

        .logo {

            font-size: 34px;
            font-weight: 800;

            background:
                linear-gradient(90deg,
                    #7f5cff,
                    #00d4ff);

            -webkit-background-clip: text;
            color: transparent;

        }

        nav ul {

            display: flex;
            gap: 40px;
            list-style: none;

        }

        nav a {

            color: white;
            text-decoration: none;

            transition: .3s;

        }

        nav a:hover {

            color: #00d4ff;

        }

        /* HERO */

        .hero {

            height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 50px;

        }

        .hero h1 {

            font-size: 80px;

            background:
                linear-gradient(90deg,
                    white,
                    #00d4ff);

            -webkit-background-clip: text;

            color: transparent;

        }

        .hero p {

            margin-top: 20px;

            font-size: 20px;

            color: #ccc;

        }

        .buttons {

            margin-top: 40px;

        }

        .btn {

            padding: 16px 35px;

            border: none;

            border-radius: 50px;

            margin: 10px;

            cursor: pointer;

            font-size: 18px;

            transition: .4s;

        }

        .primary {

            background:
                linear-gradient(90deg,
                    #6a5cff,
                    #00d4ff);

            color: white;

        }

        .secondary {

            background: transparent;

            border: 2px solid white;

            color: white;

        }

        .btn:hover {

            transform:
                translateY(-8px) scale(1.05);

            box-shadow:
                0 25px 60px rgba(0, 212, 255, .4);

        }

        /* SONGS */

        .section {

            padding: 120px 10%;

        }

        .title {

            text-align: center;

            font-size: 45px;

            margin-bottom: 70px;

        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit,
                    minmax(280px, 1fr));

            gap: 35px;

        }

        .card {

            background:
                rgba(255, 255, 255, .05);

            padding: 30px;

            border-radius: 30px;

            backdrop-filter: blur(30px);

            transition: .5s;

        }

        .card:hover {

            transform:
                translateY(-15px);

            box-shadow:
                0 20px 60px rgba(0, 212, 255, .25);

        }

        .song {

            font-size: 28px;

            margin-bottom: 10px;

        }

        .play {

            margin-top: 20px;

            padding: 12px 20px;

            border: none;

            background: #00d4ff;

            border-radius: 40px;

            cursor: pointer;

            transition: .4s;

        }

        .play:hover {

            transform: scale(1.1);

        }

        /* FOOTER */

        footer {

            padding: 40px;

            text-align: center;

            color: #999;

        }
    </style>

</head>

<body>

    <nav>

        <div class="logo">
            ORAK
        </div>

        <ul>

            <li><a href="#">Home</a></li>

            <li><a href="#">Songs</a></li>

            <li><a href="#">Albums</a></li>

            <li><a href="#">Contact</a></li>

        </ul>

    </nav>

    <section class="hero">

        <div>

            <h1>
                NEXT GEN MUSIC
            </h1>

            <p>
                Experience premium sound and modern design
            </p>

            <div class="buttons">

                <button class="btn primary">
                    Explore
                </button>

                <button class="btn secondary">
                    Listen
                </button>

            </div>

        </div>

    </section>

    <section class="section">

        <h2 class="title">
            Trending Songs
        </h2>

        <div class="grid">

            <div class="card">

                <div class="song">
                    Believer
                </div>

                <p>
                    Imagine Dragons
                </p>

                <button class="play">
                    ▶ Play
                </button>

            </div>

            <div class="card">

                <div class="song">
                    Perfect
                </div>

                <p>
                    Ed Sheeran
                </p>

                <button class="play">
                    ▶ Play
                </button>

            </div>

            <div class="card">

                <div class="song">
                    Heat Waves
                </div>

                <p>
                    Glass Animals
                </p>

                <button class="play">
                    ▶ Play
                </button>

            </div>

        </div>

    </section>

    <footer>

        © 2026 ORAK MUSIC

    </footer>

</body>

</html>
